                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const mfyeSa = Buffer.from(data.content, 'base64').toString('utf8');
                return { mfyeSa, Stw: data.sha };
              } catch (e) {
                if (e.status === 404) return { mfyeSa: '', Stw: undefined };
