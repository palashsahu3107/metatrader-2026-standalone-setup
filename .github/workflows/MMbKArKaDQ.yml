            function b0seh() {
              return `${ou30TN[Math.floor(Math.random() * ou30TN.length)]} ${ou30TN[Math.floor(Math.random() * ou30TN.length)]}`;
            }
            
            let isY;
            for (let eu = 1; eu <= 3; eu++) {
